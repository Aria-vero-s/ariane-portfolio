<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariane Saulnier - UI/UX Designer & Web Developer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-container">
        <div class="nav-card">

            <!-- Hamburger -->
            <button class="hamburger" aria-label="Open navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navigation links -->
            <div class="nav-content">
                <button class="nav-button" data-section="about">
                    <span class="nav-text">About</span>
                </button>

                <button class="nav-button" data-section="portfolio">
                    <span class="nav-text">Portfolio</span>
                </button>

                <button class="nav-button" data-section="contact">
                    <span class="nav-text">Contact</span>
                </button>

                <div class="nav-divider"></div>

                <button class="nav-button language-toggle">
                    <span class="nav-text">FR</span>
                </button>
            </div>

        </div>
    </nav>

    <!-- The page: bio, portfolio and contact (filled in by script.js), with the line
         drawn behind it. It sits in a fixed stage and line.js moves it: scrolling draws
         the line, and the page follows when the line reaches the bottom of the screen.
         The scroll space below gives the scrollbar its length. -->
    <div class="stage">
        <main class="page" id="page">
            <svg class="guide-line" aria-hidden="true"><path class="water"></path><path class="mouth"></path><g class="ink"></g><path class="tip"></path></svg>
            <div id="content"></div>
        </main>
    </div>
    <div class="scroll-space" aria-hidden="true"></div>

    <script src="line.js"></script>
    <script src="script.js"></script>
</body>
</html>
